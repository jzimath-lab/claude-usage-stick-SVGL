name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Versoes pinadas: o core e as libs determinam o binario gerado.
  # O arduino-cli apenas orquestra, por isso nao e pinado aqui.
  ESP32_CORE: 3.3.11
  LIB_GFX: 1.6.5
  LIB_LVGL: 9.2.2
  BOARD_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar core ESP32 ${{ env.ESP32_CORE }}
        run: |
          arduino-cli core update-index --additional-urls "$BOARD_URL"
          arduino-cli core install "esp32:esp32@${ESP32_CORE}" --additional-urls "$BOARD_URL"

      - name: Instalar bibliotecas
        run: arduino-cli lib install "GFX Library for Arduino@${LIB_GFX}" "lvgl@${LIB_LVGL}"

      - name: Compilar firmware principal
        working-directory: firmware/claude_stick
        run: ./build.sh

      # O bringup tem build.sh proprio: nao tem partitions.csv, entao nao pode
      # usar o PartitionScheme=custom do FQBN do projeto.
      - name: Compilar bringup
        working-directory: firmware/bringup
        run: ./build.sh

  # Guarda contra o monolito voltar a crescer (ver ZYN-379).
  # Passou a FALHAR o build: a quebra terminou e todos os arquivos estao abaixo
  # do limite (maior e ui_refresh.cpp com 238 linhas). O claude_stick.ino saiu
  # de 2278 para 284. Um limite que so avisa deixa de ser limite.
  # logo_assets.h fica de fora: e asset gerado por tools/gen_logo_assets.py.
  tamanho-dos-arquivos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arquivos acima de 500 linhas
        run: |
          fail=0
          while IFS= read -r f; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 500 ]; then
              echo "::error file=$f::$f tem $n linhas (limite 500)"
              fail=1
            fi
          done < <(find firmware -type f \( -name '*.ino' -o -name '*.cpp' -o -name '*.h' \) ! -name 'logo_assets.h')
          [ "$fail" -eq 0 ] && echo "Todos os arquivos dentro do limite."
          exit "$fail"

  # Teste de host do parser do bridge (codex_parse.h) contra um fixture real.
  # Pegou o bug do ']' interno do "v":[...] que zerava o daily — guarda contra regressao.
  parser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e rodar o teste do parser (host, sem Arduino)
        working-directory: firmware/tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -o parse_test parse_test.cpp
          ./parse_test fixture.json
      # Parser do GitHub. A fixture e o payload REAL servido pela estacao.
      # Guarda duas armadilhas de busca ingenua por substring em JSON:
      #   - o ']' interno do "v":[...] truncando o array de dias
      #   - um VALOR igual ao nome de uma chave ("nome":"ci" antes de "ci":[...])
      - name: Parser do GitHub (fixture = payload real da estacao)
        working-directory: firmware/tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I../claude_stick \
            -o github_parse_test github_parse_test.cpp
          ./github_parse_test
      # Parser das cotas de IA vindas da VPS (o caminho que substitui a busca
      # propria do Claude, recusada com HTTP 401 desde 25/08/2026).
      # A fixture e o payload REAL do /api/display, com o documento INTEIRO —
      # o parser precisa achar sua parte no meio de clima, grafico e infra.
      # Cobre tambem a conversao ISO->epoch feita a mao (mktime interpretaria em
      # fuso LOCAL e daria 3 h de erro), com assercoes EXATAS e um caso de marco
      # de ano bissexto, que e o menor que exerce o ajuste — 29/02 NAO exerce.
      - name: Parser das cotas da VPS (fixture = payload real do /api/display)
        working-directory: firmware/tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -o cotas_parse_test cotas_parse_test.cpp
          ./cotas_parse_test cotas_fixture.json
      # Credenciais da VPS: base64 do basicAuth e composicao da URL. Assercoes
      # EXATAS contra base64 de referencia — "comeca com Basic " ficaria verde
      # com qualquer codificacao errada. Cobre tambem os dois casos que geram
      # 401 sem relacao aparente com a causa: dois-pontos DENTRO da senha (so o
      # primeiro separa) e buffer curto, que RECUSA em vez de truncar.
      - name: Credenciais da VPS (base64 + URL)
        working-directory: firmware/tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -o vps_creds_test vps_creds_test.cpp
          ./vps_creds_test
